[build]
  command = "node scripts/generate-seo-pages.mjs"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://github.com https://api.netlify.com; script-src 'self' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://avatars.githubusercontent.com; media-src 'self' blob:; connect-src 'self' https://api.github.com https://api.netlify.com https://github.com; font-src 'self' data:; worker-src 'self' blob:; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/documents/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[redirects]]
  from = "/points-information"
  to = "/points-information.html"
  status = 200

[[redirects]]
  from = "/points-information/:slug"
  to = "/points-information.html?suivi=:slug"
  status = 200

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/content/*"
  [headers.values]
    X-Robots-Tag = "noindex, nosnippet"

[[redirects]]
  from = "/communiques"
  to = "/communiques.html"
  status = 200

[[redirects]]
  from = "/propositions-contributions"
  to = "/propositions-contributions.html"
  status = 200

[[redirects]]
  from = "/dossiers/numerisation-securite-resilience"
  to = "/dossier-numerisation.html"
  status = 200
