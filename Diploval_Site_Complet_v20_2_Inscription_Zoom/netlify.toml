[build]
  command = "node Diploval_Site_Complet_v20_2_Inscription_Zoom/scripts/generate-seo-pages.mjs && node Diploval_Site_Complet_v20_2_Inscription_Zoom/scripts/check-site.mjs"
  publish = "Diploval_Site_Complet_v20_2_Inscription_Zoom"

# PDF Diploval : intégration autorisée uniquement depuis diploval.fr lui-même.
# Cette règle DOIT rester avant /assets/* et avant /*.
[[headers]]
  for = "/assets/documents/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'"

# Administration : non indexée + protections de sécurité.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://github.com https://api.netlify.com; script-src 'self' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://avatars.githubusercontent.com; media-src 'self' blob:; connect-src 'self' https://api.github.com https://api.netlify.com https://github.com; font-src 'self' data:; frame-src 'self' blob:; worker-src 'self' blob:; upgrade-insecure-requests"

# Données éditoriales : jamais indexées et jamais mises en cache.
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Robots-Tag = "noindex, nosnippet"
    X-Content-Type-Options = "nosniff"

# Autres ressources statiques.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Règle générale pour les pages du site.
# Elle reste volontairement en dernier : Netlify applique la première règle d'en-tête correspondante.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://github.com https://api.netlify.com; script-src 'self' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://avatars.githubusercontent.com; media-src 'self' blob:; connect-src 'self' https://api.github.com https://api.netlify.com https://github.com; font-src 'self' data:; frame-src 'self' blob:; worker-src 'self' blob:; upgrade-insecure-requests"

[[redirects]]
  from = "/points-information"
  to = "/points-information.html"
  status = 200

[[redirects]]
  from = "/points-information/:slug"
  to = "/points-information.html?suivi=:slug"
  status = 200

[[redirects]]
  from = "/communiques"
  to = "/communiques.html"
  status = 200

[[redirects]]
  from = "/propositions-contributions"
  to = "/propositions-contributions.html"
  status = 200

[[redirects]]
  from = "/dossiers/numerisation-securite-resilience"
  to = "/dossier-numerisation.html"
  status = 200
