backend:
  name: github
  repo: DiplovalOfficiel/diploval-site
  branch: main
  site_domain: diploval.fr

locale: fr
site_url: https://diploval.fr
display_url: https://diploval.fr
logo_url: https://diploval.fr/assets/logo-diploval.jpg
show_preview_links: true

media_folder: "Diploval_Site_Complet_v20_2_Inscription_Zoom/assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "publications_admin"
    label: "Publications & PDF"
    files:
      - label: "Bibliothèque des publications"
        name: "publications"
        file: "Diploval_Site_Complet_v20_2_Inscription_Zoom/content/publications.json"
        format: "json"
        fields:
          - label: "Publications"
            name: "publications"
            widget: "list"
            collapsed: true
            add_to_top: true
            label_singular: "Ajouter une publication"
            summary: "{{fields.title}} — {{fields.status}}"
            fields:
              - { label: "Visible sur le site", name: "visible", widget: "boolean", default: false }
              - { label: "Mettre en avant", name: "featured", widget: "boolean", default: false }
              - { label: "Identifiant interne (facultatif)", name: "id", widget: "string", required: false, hint: "Pour une nouvelle publication, vous pouvez laisser vide. Le site créera un identifiant à partir du titre." }
              - { label: "Titre", name: "title", widget: "string" }
              - label: "Type de publication"
                name: "type"
                widget: "select"
                options: ["Analyse", "Article", "Charte · Socle", "Édito", "Mémorandum", "Note stratégique", "Note d’éclairage", "Rapport", "Référentiel", "Suivi", "Synthèse décideurs"]
              - label: "Filtre de format"
                name: "type_filter"
                widget: "select"
                options:
                  - { label: "Note", value: "note" }
                  - { label: "Analyse", value: "analyse" }
                  - { label: "Mémorandum", value: "memorandum" }
                  - { label: "Rapport", value: "rapport" }
                  - { label: "Référentiel / Charte", value: "referentiel" }
                  - { label: "Suivi", value: "suivi" }
              - label: "Échelle"
                name: "scope"
                widget: "select"
                options: ["Territorial", "National", "Europe", "International", "Multi-échelles"]
              - label: "Filtre d’échelle"
                name: "scope_filter"
                widget: "select"
                options:
                  - { label: "Territorial", value: "territorial" }
                  - { label: "National", value: "national" }
                  - { label: "Europe", value: "europe" }
                  - { label: "International", value: "international" }
                  - { label: "Multi-échelles", value: "multi" }
              - label: "Statut"
                name: "status"
                widget: "select"
                options: ["Brouillon", "Document de travail", "En cours", "En consolidation", "Publié", "Archivé"]
              - { label: "Version", name: "version", widget: "string", required: false }
              - { label: "Date affichée", name: "date_label", widget: "string", required: false, hint: "Ex. 14 août 2026, Publication : août 2026" }
              - { label: "Informations courtes sous le titre", name: "meta", widget: "string", required: false, hint: "Ex. Version 1.3 · août 2026" }
              - { label: "Format / pagination", name: "format", widget: "string", required: false, hint: "Ex. PDF · 14 pages" }
              - { label: "Résumé très court (carte)", name: "short_summary", widget: "text" }
              - { label: "Résumé principal", name: "summary", widget: "text" }
              - { label: "Détails complémentaires", name: "details", widget: "text", required: false }
              - { label: "Mots-clés de recherche", name: "keywords", widget: "text", required: false }
              - { label: "Image de présentation", name: "cover", widget: "image", required: false, choose_url: false, allow_multiple: false, hint: "Une image horizontale 16:9 ou proche est idéale. Le site l’adapte automatiquement au mobile et au PC." }
              - { label: "PDF", name: "pdf", widget: "file", required: false, choose_url: false, allow_multiple: false, hint: "Laissez vide si le document n’est pas encore consultable." }

  - name: "dossiers_admin"
    label: "Dossiers en cours"
    files:
      - label: "Dossiers actuellement à l’étude"
        name: "dossiers"
        file: "Diploval_Site_Complet_v20_2_Inscription_Zoom/content/dossiers.json"
        format: "json"
        fields:
          - label: "Dossiers"
            name: "dossiers"
            widget: "list"
            collapsed: true
            add_to_top: true
            label_singular: "Ajouter un dossier"
            summary: "{{fields.title}} — {{fields.status}}"
            fields:
              - { label: "Visible sur le site", name: "visible", widget: "boolean", default: false }
              - { label: "Titre", name: "title", widget: "string" }
              - label: "Statut"
                name: "status"
                widget: "select"
                options:
                  - { label: "En cours", value: "en_cours" }
                  - { label: "En finalisation", value: "finalisation" }
                  - { label: "Publié / traité", value: "publie" }
                  - { label: "En pause", value: "pause" }
                  - { label: "Archivé", value: "archive" }
              - { label: "Échelle / territoire", name: "scope", widget: "string", hint: "Ex. National · Eau ou Territorial · Gironde" }
              - { label: "Résumé", name: "summary", widget: "text" }
              - { label: "Image (facultatif)", name: "cover", widget: "image", required: false, choose_url: false, allow_multiple: false }
              - { label: "Identifiant de la publication finale (facultatif)", name: "publication_id", widget: "string", required: false, hint: "Quand le dossier est publié, vous pouvez lier ici son identifiant de publication." }

  - name: "agenda_admin"
    label: "Agenda"
    files:
      - label: "Rendez-vous & événements"
        name: "agenda"
        file: "Diploval_Site_Complet_v20_2_Inscription_Zoom/content/agenda.json"
        format: "json"
        fields:
          - label: "Événements"
            name: "events"
            widget: "list"
            collapsed: true
            add_to_top: true
            label_singular: "Ajouter un événement"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { label: "Visible sur le site", name: "visible", widget: "boolean", default: false }
              - { label: "Titre", name: "title", widget: "string" }
              - label: "Type d’événement"
                name: "category"
                widget: "select"
                options: ["Rencontre", "Visioconférence", "Déplacement", "Intervention", "Publication", "Réunion de travail"]
              - label: "Mode"
                name: "mode"
                widget: "select"
                options:
                  - { label: "En ligne", value: "online" }
                  - { label: "Sur place", value: "physical" }
                  - { label: "Hybride", value: "hybrid" }
              - { label: "Date", name: "date", widget: "datetime", date_format: "DD/MM/YYYY", time_format: false }
              - { label: "Heure de début", name: "start_time", widget: "string", required: false, hint: "Ex. 19:00" }
              - { label: "Heure de fin", name: "end_time", widget: "string", required: false, hint: "Ex. 20:30" }
              - label: "Accès"
                name: "access"
                widget: "select"
                options: ["Ouvert au public", "Sur inscription", "Sur invitation", "Rencontre de travail"]
              - { label: "Résumé", name: "summary", widget: "text" }
              - { label: "Plateforme en ligne (si besoin)", name: "platform", widget: "string", required: false, hint: "Ex. Zoom" }
              - { label: "Lien en ligne / inscription externe (si besoin)", name: "online_url", widget: "string", required: false }
              - { label: "Nom du lieu (si sur place)", name: "venue", widget: "string", required: false }
              - { label: "Adresse (si sur place)", name: "address", widget: "string", required: false }
              - { label: "Ville / territoire", name: "city", widget: "string", required: false }
              - { label: "Utiliser le formulaire d’inscription Diploval", name: "registration", widget: "boolean", default: false, hint: "À activer pour ouvrir le formulaire intégré déjà relié à Netlify Forms." }
              - { label: "Nombre de places (facultatif)", name: "capacity", widget: "number", required: false, value_type: "int", min: 1 }
              - label: "Statut"
                name: "status"
                widget: "select"
                options:
                  - { label: "À venir", value: "a_venir" }
                  - { label: "Annulé", value: "annule" }
                  - { label: "Terminé / archive", value: "termine" }

  - name: "articles_admin"
    label: "Actualités & articles"
    files:
      - label: "Articles du site"
        name: "articles"
        file: "Diploval_Site_Complet_v20_2_Inscription_Zoom/content/articles.json"
        format: "json"
        fields:
          - label: "Articles"
            name: "articles"
            widget: "list"
            collapsed: true
            add_to_top: true
            label_singular: "Ajouter un article"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { label: "Visible sur le site", name: "visible", widget: "boolean", default: false }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "datetime", date_format: "DD/MM/YYYY", time_format: false }
              - { label: "Catégorie", name: "category", widget: "string", required: false, hint: "Ex. Mise à jour, Terrain, Contribution, Vie de Diploval" }
              - { label: "Image de présentation", name: "cover", widget: "image", required: false, choose_url: false, allow_multiple: false }
              - { label: "Introduction", name: "intro", widget: "text" }
              - { label: "Texte", name: "body", widget: "text", required: false, hint: "Séparez les paragraphes par une ligne vide." }
              - { label: "Lien facultatif", name: "link", widget: "string", required: false }
              - { label: "Texte du lien", name: "link_label", widget: "string", required: false, default: "En savoir plus" }

  - name: "podcasts_admin"
    label: "Podcast"
    files:
      - label: "Épisodes — Les Voix du Vivant"
        name: "podcasts"
        file: "Diploval_Site_Complet_v20_2_Inscription_Zoom/content/podcasts.json"
        format: "json"
        fields:
          - label: "Épisodes"
            name: "episodes"
            widget: "list"
            collapsed: true
            add_to_top: true
            label_singular: "Ajouter un épisode"
            summary: "Épisode {{fields.number}} — {{fields.title}}"
            fields:
              - { label: "Visible sur le site", name: "visible", widget: "boolean", default: false }
              - { label: "Numéro", name: "number", widget: "number", value_type: "int", min: 1 }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "datetime", date_format: "DD/MM/YYYY", time_format: false, required: false }
              - { label: "Format", name: "format", widget: "select", options: ["La voix de Diploval", "Conversation"] }
              - { label: "Durée affichée", name: "duration", widget: "string", required: false, hint: "Ex. 18 min" }
              - { label: "Résumé", name: "summary", widget: "text" }
              - { label: "Image / pochette", name: "cover", widget: "image", required: false, choose_url: false, allow_multiple: false }
              - { label: "Fichier audio", name: "audio", widget: "file", required: false, choose_url: false, allow_multiple: false }
              - { label: "Transcription (facultatif)", name: "transcript", widget: "text", required: false }
