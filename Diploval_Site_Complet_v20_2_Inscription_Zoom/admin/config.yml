              - { label: "Description SEO (facultative)", name: "seo_description", widget: "text", required: false, hint: "Laissez vide pour reprendre le résumé. Courte description pour moteurs de recherche et aperçus. Si elle est absente, un résumé existant sert de repli selon la rubrique." }
              - { label: "Image de partage 1200 × 630 (facultative)", name: "social_image", widget: "image", required: false, choose_url: false, allow_multiple: false , hint: "Visuel utilisé lors du partage d’un lien sur les réseaux et messageries. Préférer une image horizontale 1200 × 630 ; vérifier lisibilité et droits." }
              - { label: "Image / pochette", name: "cover", widget: "image", required: false, choose_url: false, allow_multiple: false , hint: "Image de présentation de la carte ou de la page. Ne remplace pas l’image du PDF ; utiliser un visuel autorisé et adapté au sujet." }
