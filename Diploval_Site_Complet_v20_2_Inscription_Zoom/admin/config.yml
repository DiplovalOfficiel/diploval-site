  - name: "site_settings_admin"
    label: "Réglages du site"
    files:
      - label: "Bandeau temporaire"
        name: "site_settings"
        file: "Diploval_Site_Complet_v20_2_Inscription_Zoom/content/site-settings.json"
        format: "json"
        fields:
          - label: "Information temporaire"
            name: "temporary_notice"
            widget: "object"
            hint: "Message ponctuel affiché sur le site pour une information importante. Ne pas utiliser pour une publication de fond ou une annonce permanente."
            fields:
              - { label: "Afficher le bandeau", name: "enabled", widget: "boolean", default: false , hint: "Active ou désactive le bandeau d’information temporaire. Vérifier le texte et les dates avant activation." }
              - { label: "Libellé", name: "label", widget: "string", default: "Information" , hint: "Petit intitulé visible en tête du bandeau, par exemple Information." }
              - { label: "Texte", name: "text", widget: "text", required: false , hint: "Texte bref du bandeau. Présenter un fait ou une information datée, sans surcharge." }
              - { label: "Date de début", name: "start_date", widget: "datetime", date_format: "DD/MM/YYYY", time_format: false, required: false , hint: "Premier jour prévu d’affichage du bandeau. La date ne remplace pas l’enregistrement et le déploiement." }
              - { label: "Date de fin incluse", name: "end_date", widget: "datetime", date_format: "DD/MM/YYYY", time_format: false, required: false, hint: "Le bandeau disparaît automatiquement après cette date. Dernier jour inclus prévu pour le bandeau, qui doit ensuite disparaître automatiquement de l’affichage." }
              - { label: "Lien facultatif", name: "link", widget: "string", required: false , hint: "Adresse d’une page donnant plus d’informations sur le bandeau, si nécessaire." }
              - { label: "Texte du lien", name: "link_label", widget: "string", required: false, default: "En savoir plus" , hint: "Texte du bouton menant au complément d’information." }

  - name: "points_information_admin"
    label: "Points d’information"
    files:
      - label: "Suivis & chronologies"
        name: "points_information"
        file: "Diploval_Site_Complet_v20_2_Inscription_Zoom/content/points-information.json"
        format: "json"
        fields:
          - label: "Points d’information"
            name: "points"
            widget: "list"
            hint: "Liste des points d’information : chaque niveau, source et mise à jour doit être justifié et daté."
            collapsed: true
            add_to_top: true
            label_singular: "Ajouter un point d’information"
            summary: "{{fields.title}} — {{fields.status}}"
            fields:
              - { label: "Visible sur le site", name: "visible", widget: "boolean", default: false, hint: "À activer pour que cet élément apparaisse publiquement après le déploiement Netlify. Autorise l’affichage public après enregistrement et déploiement. Désactiver pour préparer le contenu hors des pages publiques ; le fichier déposé dans les ressources peut néanmoins rester accessible par lien direct." }
              - { label: "Afficher sur l’accueil", name: "show_home", widget: "boolean", default: true , hint: "Affiche ce point d’information parmi les suivis mis en avant sur l’accueil, sous réserve qu’il soit public et actif." }
              - { label: "Titre", name: "title", widget: "string" , hint: "Titre affiché au public sur la page et dans les listes. Le modifier peut affecter une adresse calculée automatiquement : conserver l’identifiant stable." }
              - { label: "Adresse courte / identifiant", name: "slug", widget: "string", required: false, hint: "Ex. russie-otan-septembre-2026. Laissez vide pour utiliser automatiquement le titre. Identifiant court employé dans l’adresse de la page. Le conserver après publication pour ne pas casser les liens partagés." }
              - { label: "Catégorie", name: "category", widget: "string", required: false, hint: "Ex. Géopolitique, France, Europe, Environnement Classe cet élément dans sa rubrique ou catégorie publique. Choisir le terme qui décrit réellement son contenu." }
              - label: "Statut"
                name: "status"
                widget: "select"
                hint: "État du suivi : en cours, stabilisé, clos ou archivé. L’archive ne doit pas être présentée comme un événement encore actif."
                options:
                  - { label: "Suivi en cours", value: "suivi" }
                  - { label: "Stabilisé", value: "stabilise" }
                  - { label: "Clos", value: "clos" }
                  - { label: "Archivé", value: "archive" }
              - label: "Niveau public (facultatif)"
                name: "level"
                widget: "select"
                default: "aucun"
                hint: "Laissez Aucun niveau pour un Point d’information simple. Utilisez 3, 2 ou Code One uniquement pour un suivi renforcé. Groupe de champs répétés : ajoutez une entrée par élément, puis renseignez les informations demandées. Liste des suivis chronologiques et points d’information. Chaque entrée peut être visible sur le site et sur l’accueil selon ses réglages. Niveau public de vigilance : Aucun, 3, 2 ou 1 Code One. Ne choisir un niveau élevé qu’avec une justification vérifiée et documentée."
                options:
                  - { label: "Aucun niveau — Point d’information simple", value: "aucun" }
                  - { label: "Niveau 3 — Surveillance active", value: "3" }
                  - { label: "Niveau 2 — Vigilance renforcée", value: "2" }
                  - { label: "Niveau 1 — Code One · Seuil critique", value: "1" }
              - { label: "Ouverture du suivi", name: "opened_at", widget: "datetime", date_format: "DD/MM/YYYY", time_format: "HH:mm" , hint: "Date et heure d’ouverture du suivi. Ce repère sert à la chronologie publique." }
              - { label: "Dernière mise à jour", name: "last_update", widget: "datetime", date_format: "DD/MM/YYYY", time_format: "HH:mm" , hint: "Date et heure de la dernière actualisation vérifiée du suivi. Mettre à jour lorsqu’un élément nouveau est publié." }
              - { label: "Résumé", name: "summary", widget: "text" , hint: "Résumé explicatif public qui permet de comprendre le contenu avant de l’ouvrir. Rester fidèle au document sans ajouter de fait non sourcé." }
              - { label: "Description SEO (facultative)", name: "seo_description", widget: "text", required: false, hint: "Laissez vide pour reprendre le résumé. Courte description pour moteurs de recherche et aperçus. Si elle est absente, un résumé existant sert de repli selon la rubrique." }
              - { label: "Image de partage 1200 × 630 (facultative)", name: "social_image", widget: "image", required: false, choose_url: false, allow_multiple: false , hint: "Visuel utilisé lors du partage d’un lien sur les réseaux et messageries. Préférer une image horizontale 1200 × 630 ; vérifier lisibilité et droits." }
              - { label: "Pourquoi ce niveau ? (si utilisé)", name: "why_level", widget: "text", required: false, hint: "À remplir seulement si un niveau 3, 2 ou Code One est utilisé. Expliquez les éléments convergents sans dramatiser ni transformer une hypothèse en fait. Justification publique du niveau choisi. Exposer les critères et les incertitudes, sans alarmisme." }
              - label: "Ce qui pourrait faire monter le niveau (si utilisé)"
                name: "watch_up"
                widget: "list"
                hint: "Indicateurs concrets qui pourraient justifier une hausse du niveau après vérification."
                required: false
                field: { label: "Élément", name: "item", widget: "string" , hint: "Élément ou critère observable associé à une montée ou descente de niveau. Rester concret et vérifiable." }
              - label: "Ce qui pourrait faire redescendre le niveau (si utilisé)"
                name: "watch_down"
                widget: "list"
                hint: "Indicateurs concrets qui pourraient justifier une baisse du niveau après vérification."
                required: false
                field: { label: "Élément", name: "item", widget: "string" , hint: "Élément ou critère observable associé à une montée ou descente de niveau. Rester concret et vérifiable." }
              - label: "Sources principales"
                name: "sources"
                widget: "list"
                collapsed: true
                required: false
                hint: "Privilégiez, quand c’est possible, trois sources solides et réellement distinctes : source primaire/institutionnelle, agence ou média reconnu, et source permettant de confronter ou compléter. Références documentaires du suivi ou d’une mise à jour. Ajouter des sources primaires et contradictoires lorsque disponibles."
                fields:
                  - { label: "Nom", name: "label", widget: "string" , hint: "Nom court ou intitulé affiché dans l’interface. Choisir un texte compréhensible pour une personne extérieure au projet." }
                  - label: "Type"
                    name: "type"
                    widget: "select"
                    hint: "Nature de la source (document officiel, agence, média, etc.). Elle aide le lecteur à identifier sa provenance."
                    options: ["Source officielle", "Agence de presse", "Média", "Organisation internationale", "Document", "Autre"]
                  - { label: "Lien", name: "url", widget: "string" , hint: "Adresse complète de la source ou du lien, de préférence en https://. Tester le lien avant publication et vérifier qu’il pointe vers le bon document." }
                  - { label: "Précision facultative", name: "note", widget: "string", required: false , hint: "Précision utile sur la source, sa portée ou ses limites. Éviter les affirmations qui ne figurent pas dans la source." }
              - label: "Chronologie"
                name: "updates"
                widget: "list"
                hint: "Chronologie des faits et corrections datés. Chaque mise à jour doit être fondée sur des éléments vérifiables."
                collapsed: true
                add_to_top: true
                label_singular: "Ajouter une mise à jour"
                summary: "{{fields.datetime}} — {{fields.title}}"
                fields:
                  - { label: "Date et heure", name: "datetime", widget: "datetime", date_format: "DD/MM/YYYY", time_format: "HH:mm" , hint: "Date et heure de l’événement ou de la mise à jour. Respecter la chronologie et le fuseau horaire indiqué." }
                  - { label: "Titre court", name: "title", widget: "string" , hint: "Titre affiché au public sur la page et dans les listes. Le modifier peut affecter une adresse calculée automatiquement : conserver l’identifiant stable." }
                  - { label: "Texte", name: "body", widget: "text" , hint: "Compte rendu de cette étape de suivi : distinguer les faits confirmés, les déclarations attribuées et les incertitudes." }
                  - { label: "Correction substantielle", name: "correction", widget: "boolean", default: false, required: false , hint: "Cochez si cette mise à jour corrige substantiellement une affirmation antérieure ; expliquer ce qui change dans le texte." }
                  - label: "Sources de cette mise à jour"
                    name: "sources"
                    widget: "list"
                    hint: "Références documentaires du suivi ou d’une mise à jour. Ajouter des sources primaires et contradictoires lorsque disponibles."
                    collapsed: true
                    required: false
                    fields:
                      - { label: "Nom", name: "label", widget: "string" , hint: "Nom court ou intitulé affiché dans l’interface. Choisir un texte compréhensible pour une personne extérieure au projet." }
                      - { label: "Lien", name: "url", widget: "string" , hint: "Adresse complète de la source ou du lien, de préférence en https://. Tester le lien avant publication et vérifier qu’il pointe vers le bon document." }
